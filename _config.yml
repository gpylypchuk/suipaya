title: suipaya
author: Geronimo Pylypchuk
description: Resúmenes y notas de los cursos que voy haciendo.
baseurl: ""
url: https://gpylypchuk.github.io
lang: es
name: tufte
markdown: kramdown
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
timezone: America/Argentina/Buenos_Aires
excerpt_separator: <!--more-->  # you can specify your own separator, of course.
exclude: ['Gemfile', 'Gemfile.lock', 'README.md', 'ROADMAP.md']

# Cursos en /cs149/; clases y assignments en /cs149/clase01/, según la ruta del archivo.
# Proyectos en /proyectos/polysome/; notas en /proyectos/polysome/nota01/
collections:
  cursos:
    output: true
    permalink: /:name/
  clases:
    output: true
    permalink: /:path/
  assignments:
    output: true
    permalink: /:path/
  proyectos:
    output: true
    permalink: /proyectos/:name/
  notas:
    output: true
    permalink: /proyectos/:path/

defaults:
  - scope:
      path: ""
      type: cursos
    values:
      layout: curso
  - scope:
      path: ""
      type: clases
    values:
      layout: clase
  - scope:
      path: ""
      type: assignments
    values:
      layout: assignment
  - scope:
      path: ""
      type: proyectos
    values:
      layout: proyecto
  - scope:
      path: ""
      type: notas
    values:
      layout: nota
