---
layout: default
---

<h1 class="titulo-sitio">{{ site.title }}</h1>
<p>Este es el sitio de Geronimo Pylypchuk.</p>

{% if site.cursos %}
{% assign cursos = site.cursos | sort: "orden" %}
<ul class="lista-cursos">
  {% for curso in cursos %}
    <li>
      <a class="titulo-curso" href="{{ curso.url | prepend: site.baseurl }}">{{ curso.title }}</a>
      <p class="justificado">{{ curso.descripcion }}</p>
    </li>
  {% endfor %}
</ul>
{% endif %}
